name: Policy and Core Validation CI

on:
  push:
    branches: [ main, v0.8, master ]
  pull_request:
    branches: [ main, v0.8, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Deterministic Phase 5 Verification (AST & Policy)
        run: |
          python3 core/verify/phase5_verify.py
